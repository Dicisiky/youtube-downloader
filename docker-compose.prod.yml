services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yt_livestream
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/yt_livestream?schema=public
      RECORDINGS_DIR: /app/storage/recordings
      FFMPEG_PATH: /usr/bin/ffmpeg
      YTDLP_COOKIES_FILE: /app/secrets/cookies.txt
      YTDLP_BROWSER_PROFILE_DIR: /app/secrets/chrome-profile
      YTDLP_BROWSER_PROFILES_DIR: /app/secrets/chrome-profiles
      YTDLP_POT_PROVIDER_URL: http://bgutil-provider:4416
    volumes:
      - ./storage/recordings:/app/storage/recordings
      - ./secrets/cookies.txt:/app/secrets/cookies.txt
      - ./secrets/chrome-profile:/app/secrets/chrome-profile
      - ./secrets/chrome-profiles:/app/secrets/chrome-profiles
    depends_on:
      postgres:
        condition: service_healthy
      bgutil-provider:
        condition: service_started

  # Mints YouTube PO tokens for yt-dlp's bgutil plugin (installed in the
  # backend image -- keep this tag in step with BGUTIL_VERSION there). Only
  # reachable from the backend over the compose network; no published port.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    init: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
